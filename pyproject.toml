[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssdiff"
version = "1.0.0"
description = "Supervised Semantic Differential (SSD): interpretable, embedding-based analysis of concept meaning in text."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  {name = "Hubert Plisiecki", email = "hplisiecki@gmail.com"},
  {name = "Paweł Lenartowicz", email = "pawellenartowicz@europe.com"}
]
keywords = ["NLP", "semantics", "word embeddings", "psychometrics", "semantic differential", "computational social science"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "numpy>=1.26.4",
  "spacy>=3.7.2",
  "click>=8.1",  # spacy imports click directly but no longer gets it via typer>=0.26
  "plskit>=0.1.0",
]

[project.optional-dependencies]
gensim = [
  "gensim>=4.0",
]
results = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "python-docx>=1.0",
  "matplotlib>=3.7",  
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-timeout>=2.0",
  "ruff>=0.5",
  "build>=1.0.0",
  "twine>=4.0",
  "scikit-learn>=1.5",
  "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/hplisiecki/Supervised-Semantic-Differential"
Repository = "https://github.com/hplisiecki/Supervised-Semantic-Differential"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "local: marks tests that need local files not in repo",
]
filterwarnings = [
  "ignore:Saving as .*normalization and ABTT metadata will be lost.*:UserWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "SIM",    # flake8-simplify
  "RUF",    # ruff-specific rules
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "SIM108", # ternary operator (readability preference)
  "B905",   # zip strict (3.10 compat)
  "UP007",  # X | Y union syntax in annotations (already used, but keep flexible)
  "RUF001", # ambiguous unicode — Polish text has special chars
  "RUF002", # ambiguous unicode in docstrings — math notation (−, ×, –)
  "RUF003", # ambiguous unicode in comments — math notation (−, ×, –)
  "RUF005", # collection-literal-concatenation (style preference)
  "RUF012", # mutable-class-default (dataclass fields)
  "RUF007", # zip-instead-of-pairwise (pairwise is 3.10+ only, zip is clearer here)
  "RUF015", # unnecessary-iterable-allocation-for-first-element (readability preference)
  "RUF059", # unused-unpacked-variable (common in tests)
  "SIM103", # needless-bool (explicit if/return is clearer)
]

[tool.ruff.lint.isort]
known-first-party = ["ssdiff"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.packages.find]
where = ["."]
include = ["ssdiff*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
ssdiff = ["py.typed"]
"ssdiff.utils" = ["*.txt"]
