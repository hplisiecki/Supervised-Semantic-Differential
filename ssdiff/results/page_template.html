<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSD Results Page</title>
<style>
/* Layout: header strip, summary cards, tab bar; each tab is a grid of panels that stacks below 900px. */
:root {
  --bg: #F0F0F0; --panel: #E8E8E8; --panel-2: #FFFFFF;
  --border: #C0C0C0; --border-2: #D4D4D4;
  --fg: #0A0A0A; --fg-2: #3A3A3A; --fg-3: #686868;
  --accent: #163060; --accent-fg: #FFFFFF; --sel: #B8CCE8;
  --row-alt: #F5F5F5; --badge-ols: #5cb85c; --badge-groups: #f0ad4e;
  --note-bg: #FFF6D8; --note-fg: #5A4600;
  --font: "Segoe UI", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 4px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14151f; --panel: #1c1d2e; --panel-2: #222336;
  --border: #353650; --border-2: #2c2d44;
  --fg: #e4e4f0; --fg-2: #9c9cb4; --fg-3: #6e6e88;
  --accent: #6c9ce6; --accent-fg: #14151f; --sel: #3d5a8a;
  --row-alt: #1f2032; --note-bg: #2e2a1a; --note-fg: #e8d9a0;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #14151f; --panel: #1c1d2e; --panel-2: #222336;
  --border: #353650; --border-2: #2c2d44;
  --fg: #e4e4f0; --fg-2: #9c9cb4; --fg-3: #6e6e88;
  --accent: #6c9ce6; --accent-fg: #14151f; --sel: #3d5a8a;
  --row-alt: #1f2032; --note-bg: #2e2a1a; --note-fg: #e8d9a0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 var(--font); margin: 0; }
#app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }


/* header */
.hdr { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.hdr h1 { font-size: 20px; margin: 0; font-weight: 700; text-wrap: balance; }
.badge { display: inline-block; padding: 2px 8px; border-radius: var(--r); font-size: 11px; font-weight: 700; letter-spacing: .04em; background: var(--accent); color: var(--accent-fg); }
.badge.pca_ols { background: var(--badge-ols); color: #fff; }
.badge.groups { background: var(--badge-groups); color: #1a1200; }
.meta { color: var(--fg-2); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.meta b { color: var(--fg); font-weight: 600; }
.hdr .spacer { flex: 1; }

/* buttons and menus */
.btn { background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--r); padding: 4px 10px; }
.btn:hover { border-color: var(--accent); }
.btn.small { padding: 1px 7px; font-size: 12px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--r); box-shadow: 0 6px 18px rgba(0,0,0,.18); min-width: 170px; padding: 4px 0; }
.menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 5px 12px; }
.menu button:hover { background: var(--sel); }
.menu hr { border: 0; border-top: 1px solid var(--border-2); margin: 4px 0; }
.menu .hint { color: var(--fg-3); font-size: 11px; padding: 2px 12px 4px; }

/* unit selector */
.unitbar { display: flex; align-items: center; gap: 8px; }

/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 0; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); }
.card { padding: 10px 12px; text-align: center; border-right: 1px solid var(--border-2); }
.card:last-child { border-right: 0; }
.card .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.card .n { color: var(--fg-2); font-size: 12px; }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab { background: none; border: 1px solid transparent; border-bottom: 0; border-radius: var(--r) var(--r) 0 0; padding: 6px 14px; color: var(--fg-2); white-space: nowrap; margin-bottom: -1px; }
.tab[aria-selected="true"] { background: var(--panel); border-color: var(--border); color: var(--fg); font-weight: 600; }
.tabpanel { background: var(--panel); border: 1px solid var(--border); border-top: 0; border-radius: 0 0 var(--r) var(--r); padding: 12px; min-width: 0; }

/* panels */
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.box { background: var(--panel-2); border: 1px solid var(--border-2); border-radius: var(--r); padding: 10px; min-width: 0; }
.box h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
.box h3 .sub { color: var(--fg-3); font-weight: 400; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.controls label { display: flex; align-items: center; gap: 6px; color: var(--fg-2); }
.controls input[type=number] { width: 64px; background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--r); padding: 2px 6px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.seg button { background: var(--panel-2); border: 0; padding: 3px 12px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.muted { color: var(--fg-3); }
.empty { color: var(--fg-3); padding: 18px 4px; }

/* tables */
.tbl-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.tbl-head h3 { margin: 0; flex: 1; }
.tbl-scroll { overflow: auto; max-height: 520px; border: 1px solid var(--border-2); border-radius: var(--r); }
.tbl-scroll.short { max-height: 320px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; background: var(--panel); font-size: 11px; text-transform: uppercase; font-weight: 600; letter-spacing: .03em; color: var(--fg-2); text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; user-select: none; }
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--fg); }
th .arrow { color: var(--accent); }
td { padding: 4px 8px; border-bottom: 1px solid var(--border-2); vertical-align: top; }
tbody tr:nth-child(even) td { background: var(--row-alt); }
tbody tr.sel td { background: var(--sel); }
tbody tr.clickable { cursor: pointer; }
td.num, th.num { text-align: right; white-space: nowrap; }
td.text { min-width: 260px; }
.more { display: flex; gap: 8px; align-items: center; padding-top: 6px; color: var(--fg-3); font-size: 12px; }

/* detail */
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; margin: 0; }
dl.kv dt { color: var(--fg-2); }
dl.kv dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kv-group + .kv-group { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-2); }
.kv-group h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--fg-3); font-weight: 600; }
.quote { background: var(--bg); border-radius: var(--r); padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 4px 0 0; }
.words { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.chip { background: var(--bg); border: 1px solid var(--border-2); border-radius: var(--r); padding: 0 6px; }
.link { background: none; border: 0; color: var(--accent); padding: 0; text-decoration: underline; }

.err { padding: 24px; font-size: 15px; }
</style>
</head>
<body>
<div id="app"></div>

// ---------------------------------------------------------------- shared UI state
// Every table's sort and row count lives here, so the whole-report export can
// write each table as it is currently shown, including tabs not on screen.
const Store = createContext(null);
const DEFAULT_VIEW = { sort: null, limit: 100 };
function sortRows(rows, sort) {
  if (!sort) return rows;
  const { key, dir } = sort, m = dir === "asc" ? 1 : -1;
  return rows.slice().sort((a, b) => {
    const x = a[key], y = b[key];
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    if (typeof x === "number" && typeof y === "number") return (x - y) * m;
    return String(x).localeCompare(String(y)) * m;

function shownRows(spec, view) {
  const sorted = sortRows(spec.rows, view.sort);
  return spec.fixed ? sorted : sorted.slice(0, view.limit);
}

// ---------------------------------------------------------------- table widget
function DataTable({ spec, selectable, selectedKey, onSelect, rowKey, short }) {
  const store = useContext(Store);
  const view = store.views[spec.id] || DEFAULT_VIEW;
  const setView = v => store.setView(spec.id, { ...view, ...v });
  const rows = shownRows(spec, view);
  const total = spec.rows.length;
  const clickSort = col => {
    if (!col.sortable && col.sortable !== undefined) return;
    const cur = view.sort && view.sort.key === col.key ? view.sort.dir : null;
    const dir = cur === null ? (isNumFmt(col.fmt) ? "desc" : "asc") : cur === "desc" ? "asc" : "desc";
    setView({ sort: { key: col.key, dir } });
  };
  return html`
    <div class="tbl-head">
      <h3>${spec.title}${spec.subtitle ? html` <span class="sub">${spec.subtitle}</span>` : null}</h3>
      <${ExportMenu} spec=${spec} />
    </div>
    <div class=${"tbl-scroll" + (short ? " short" : "")}>
      <table>
        <thead><tr>${spec.cols.map(c => {
          const s = view.sort && view.sort.key === c.key ? (view.sort.dir === "asc" ? " \u25B2" : " \u25BC") : "";
          return html`<th class=${(isNumFmt(c.fmt) ? "num " : "") + "sortable"} onClick=${() => clickSort(c)}
            aria-sort=${s ? (view.sort.dir === "asc" ? "ascending" : "descending") : "none"}>${c.label}<span class="arrow">${s}</span></th>`;
        })}</tr></thead>
        <tbody>${rows.length === 0 ? html`<tr><td colspan=${spec.cols.length} class="muted">No rows.</td></tr>` :
          rows.map(r => {
            const key = selectable ? rowKey(r) : null;
            const sel = selectable && key === selectedKey;
            return html`<tr class=${(sel ? "sel " : "") + (selectable ? "clickable" : "")}
                tabindex=${selectable ? 0 : undefined}
                onClick=${selectable ? () => onSelect(r) : undefined}
                onKeyDown=${selectable ? e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onSelect(r); } } : undefined}>
              ${spec.cols.map(c => html`<td class=${isNumFmt(c.fmt) ? "num" : (c.wide ? "text" : "")}>${cellText(c, r)}</td>`)}
            </tr>`;
          })}

      </table>

      <div class="more">

        <button class="btn small" onClick=${() => setView({ limit: view.limit + 100 })}>Show 100 more</button>
        <button class="btn small" onClick=${() => setView({ limit: Infinity })}>Show all</button>

      ${exts.map((ext, i) => html`
        ${!report && i === 2 ? html`<hr /><div class="hint">As shown on screen</div>` : null}
        <button role="menuitem" onClick=${() => pick(ext)}>.${ext}</button>`)}
    </div>` : null}
  </div>`;
}

function tableFile(spec, view, ext) {
  const base = spec.file;
  if (ext === "csv") return { name: base + ".csv", mime: "text/csv", text: toCSV(spec.srcCols, sortRows(spec.rows, view.sort)) };
  if (ext === "json") return { name: base + ".json", mime: "application/json", text: toJSON(spec.srcCols, sortRows(spec.rows, view.sort)) };
  const rows = shownRows(spec, view);
  const fn = { md: toMD, txt: toTXT, tex: toTEX }[ext];
  return { name: base + "." + ext, mime: "text/plain", text: fn(spec.cols, rows) };
}

function download(file) {
  const blob = file.bytes ? new Blob([file.bytes], { type: file.mime }) : new Blob([file.text], { type: file.mime + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ---------------------------------------------------------------- table specs
// One place defines every table of every tab: the tabs render from these specs
// and the whole-report export walks them, so both always agree.
const C = (key, label, fmt, extra) => ({ key, label, fmt, ...extra });
const KIND_LABEL = { pls: "PLS", pca_ols: "PCA+OLS", groups: "Groups", multipls: "MultiPLS", contrast: "Contrast" };

// One of the extra gradients of ssd_gradients=N (fit_pls or fit_regression): every unit but "main"
// of a continuous fit that has a pls_info table.
const isGradient = (data, unit) =>
  (data.kind === "pls" || data.kind === "pca_ols") && !!data.tables.pls_info && unit.key !== "main";

function buildSpecs(data, unit, ui) {
  const T = unit.tables, kind = data.kind, specs = {}, text = data.texts[unit.text];
  const docCol = text.snippets === false ? "Tokens" : "Document Text";
  const add = (tab, s) => { if (s.rows) specs[s.id] = { tab, srcCols: s.srcCols, ...s }; };
  const sideName = side => side === "pos" ? unit.pos_label : unit.neg_label;
  // dim: a MultiPLS dimension, or one of the extra gradients of a PLS or regression fit
  const dim = kind === "multipls" || isGradient(data, unit);
  const moderated = kind === "pca_ols" && unit.key.includes(":");  // a text term with a moderator
  const continuous = (kind === "pls" || kind === "pca_ols") && !dim;
  // groups: each side is named by its group; dimensions and moderated terms: by their sign
  const sideSub = side => dim || moderated ? (side === "pos" ? "positive end" : "negative end")
    : continuous ? (side === "pos" ? "higher outcome" : "lower outcome") : null;

  // Cluster Overview
  const clusters = objs(T.clusters), cwords = objs(T.cluster_words);
  if (clusters) for (const side of ["pos", "neg"]) {
    const rows = clusters.filter(c => c.side === side).map(c => {
      const members = (cwords || []).filter(w => w.side === side && w.cluster_id === c.cluster_id).map(w => w.word);
      return { ...c, "#": c.cluster_id + 1, top_n: members.length ? members.slice(0, ui.topWords).join(", ") : c.top_words };
    });
    add("overview", { id: "clusters_" + side, title: sideName(side), subtitle: sideSub(side),
      file: "clusters_" + side, rows, srcCols: T.clusters.columns,
      cols: [C("#", "#", "int"), C("size", "Size", "int"), C("coherence", "Coherence", "num3"),
             C("centroid_cos_beta", "Centroid cos(\u03b2)", "num3"), C("top_n", "Top Words", "text", { wide: true })] });
  }
  const csn = objs(T.cluster_snippets);
  if (csn && ui.cluster) {
    const { side, id } = ui.cluster;
    const rows = csn.filter(s => s.side === side && s.cluster_id === id).slice(0, ui.nSnips);
    add("overview", { id: "cluster_snippets", title: `Snippets \u2014 ${sideName(side)} cluster #${id + 1}`, fixed: true,
      file: `cluster_snippets_${side}_${id + 1}`, rows, srcCols: T.cluster_snippets.columns,
      cols: [C("seed", "Seed", "seed"), C("cosine", "Cosine", "num"), C("doc_id", "Doc", "int"), C("text_window", "Snippet", "text", { wide: true })] });
  }

  // Beta / Contrast Snippets
  const sn = objs(T.snippets);
  if (sn) add("snippets", { id: "snippets_" + ui.snipSide, title: sideName(ui.snipSide) + " snippets",
    file: "snippets_" + ui.snipSide, rows: sn.filter(s => s.side === ui.snipSide), srcCols: T.snippets.columns,
    cols: [C("seed", "Seed", "seed"), C("cosine", "Cosine", "num"), C("doc_id", "Doc ID", "int"), C("text_window", "Snippet", "text", { wide: true })] });

  // Semantic Poles
  const words = objs(T.words);
  if (words) for (const side of ["pos", "neg"]) add("poles", { id: "words_" + side, title: sideName(side),
    subtitle: sideSub(side),
    file: "words_" + side, rows: words.filter(w => w.side === side), srcCols: T.words.columns,
    cols: [C("rank", "Rank", "int"), C("word", "Word", "text"), C("cos_beta", "cos(\u03b2)", "num")] });

  // Document Scores, Extreme, Misdiagnosed
  const docs = objs(T.docs);
  if (docs) {
    const scoreCols = kind === "groups" ? [C("doc_id", "Doc #", "int"), C("group", "Group", "text"), C("alignment_score", "Cosine", "num")]
      : dim ? [C("doc_id", "Doc #", "int"), C("alignment_score", "Cosine", "num")]
      : [C("doc_id", "Doc #", "int"), C("alignment_score", "Cosine", "num"), C("y_hat", "Predicted", "num")];
    add("scores", { id: "docs", title: "Documents", file: "docs", rows: docs, srcCols: T.docs.columns, cols: scoreCols });

    const byScore = docs.slice().sort((a, b) => b.alignment_score - a.alignment_score);
    const last = kind === "groups" ? C("group", "Group", "text") : dim ? null : C("y_true", "Actual Y", "num");
    const extCols = [C("rank", "Rank", "int"), C("text", docCol, "text", { wide: true }), C("alignment_score", "Score", "num"), last].filter(Boolean);
    const rank = rows => rows.map((r, i) => ({ ...r, rank: i + 1 }));
    add("extreme", { id: "extreme_high", title: "Highest scores", fixed: true, file: "extreme_high", rows: rank(byScore.slice(0, 5)), srcCols: T.docs.columns, cols: extCols });
    add("extreme", { id: "extreme_low", title: "Lowest scores", fixed: true, file: "extreme_low", rows: rank(byScore.slice(-5).reverse()), srcCols: T.docs.columns, cols: extCols });

    if (continuous) {
      const byRes = docs.slice().sort((a, b) => a.residual - b.residual);
      // With a formula on a Gaussian fit, residual has the covariates taken out but y_hat is the
      // text's part only, so y_hat could contradict the over/under-predicted labels.
      const formula = one(T.fit_info || data.tables.fit_info).formula;
      const misCols = [C("rank", "Rank", "int"), C("text", docCol, "text", { wide: true }), C("y_true", "Actual Y", "num"),
        formula ? null : C("y_hat", "Predicted Y", "num"), C("residual", "Residual", "num")].filter(Boolean);
      add("mis", { id: "mis_over", title: "Over-predicted", subtitle: "predicted higher than observed", fixed: true, file: "misdiagnosed_over", rows: rank(byRes.slice(0, 5)), srcCols: T.docs.columns, cols: misCols });
      add("mis", { id: "mis_under", title: "Under-predicted", subtitle: "predicted lower than observed", fixed: true, file: "misdiagnosed_under", rows: rank(byRes.slice(-5).reverse()), srcCols: T.docs.columns, cols: misCols });
    }
  }

  // Details: pair tests (groups), outcome loadings (MultiPLS); Covariates (formula fits); PCA Sweep table
  if (data.tables.pairs) {
    // the pairs table holds canonical g1, g2; the units carry the original group names
    const names = Object.fromEntries(data.units.map(u => [u.key, [u.pos_label, u.neg_label]]));
    const rows = objs(data.tables.pairs).map(p => ({ ...p, g1: (names[p.contrast] || [p.g1])[0], g2: (names[p.contrast] || [, p.g2])[1] }));
    add("details", { id: "pairs", title: "Pairs", file: "pairs", rows, srcCols: data.tables.pairs.columns, fixed: true,
      cols: [C("g1", "Group A", "text"), C("g2", "Group B", "text"), C("n_g1", "n_A", "int"), C("n_g2", "n_B", "int"),
             C("contrast_norm", "Contrast norm", "num"), C("p_raw", "p", "p"), C("p_corrected", "p (corr)", "p"),
             C("cohens_d", "Cohen's d", "num3")] });
  }
  if (T.outcomes) add("details", { id: "outcomes", title: `Outcome loadings \u2014 ${unit.label}`, file: "outcomes_" + unit.key,
    rows: objs(T.outcomes), srcCols: T.outcomes.columns, fixed: true,
    cols: [C("outcome", "Outcome", "text"), C("group", "Group", "text"), C("loading", "Loading", "num")] });
  if (data.tables.covariates) add("covariates", { id: "covariates", title: "Covariates", subtitle: "text held fixed",
    file: "covariates", rows: objs(data.tables.covariates), srcCols: data.tables.covariates.columns, fixed: true,
    cols: [C("term", "Term", "text"), C("estimate", "Estimate", "num"), C("se", "SE", "num"), C("statistic", "t / z", "num"),
           C("p_value", "p", "p"), C("ci_low", "95% CI low", "num"), C("ci_high", "95% CI high", "num")] });
  const tests = objs(data.tables.test);
  if (kind === "pca_ols" && tests && tests.length > 1) add("details", { id: "tests", title: "Tests", file: "tests",
    rows: tests.slice(1), srcCols: data.tables.test.columns, fixed: true,
    cols: [C("label", "Test", "text"), C("name", "Method", "text"), C("pvalue", "p", "p"), C("statistic", "Statistic", "num"),
           C("df", "df", "num"), C("df_resid", "Residual df", "num"), C("r2_delta", "\u0394R\u00B2", "num")] });
  if (text.sweep) add("sweep", { id: "sweep", title: "Sweep", file: "pca_sweep", rows: objs(text.sweep),
    srcCols: text.sweep.columns, fixed: true,
    cols: text.sweep.columns.map(c => C(c, c, c === "k" || c === "n_clusters" || c === "total_size" ? "int" : "num")) });
  return specs;
}

function tabsFor(data, specs, text) {
  const k = data.kind, t = [["overview", "Cluster Overview"], ["details", "Details"]];
  if (specs.covariates) t.push(["covariates", "Covariates"]);
  if (k === "pca_ols" && specs.sweep) t.push(["sweep", "PCA Sweep"]);
  if (Object.values(specs).some(s => s.tab === "snippets") || text.snippets === false) t.push(["snippets", k === "groups" ? "Contrast Snippets" : "Beta Snippets"]);
  t.push(["poles", "Semantic Poles"]);
  // results pickled before doc_ids existed carry no docs table for groups and MultiPLS
  if (specs.docs) {
    t.push(["scores", "Document Scores"], ["extreme", "Extreme Documents"]);
    if (specs.mis_over) t.push(["mis", "Misdiagnosed"]);
  }
  return t;
}

// ---------------------------------------------------------------- summary cards
function cardsFor(data, unit) {
  const s = one(data.tables.stats), k = data.kind;
  if (isGradient(data, unit)) {
    const u = one(unit.tables.stats);  // a gradient of ssd_gradients=N: the last two follow it
    return [["R\u00B2", fmtNum(s.r2)], ["p", fmtP(s.pvalue)], ["Docs", fmtInt(s.n_kept)],
            ["Gradients", fmtInt(one(data.tables.pls_info).ssd_gradients)], ["Cov. share", fmtNum(u.cov_share)],
            ["Score corr.", fmtNum(u.score_corr)]];
  }
  if (k === "pls") return [
    ["R\u00B2", fmtNum(s.r2)], ["p", fmtP(s.pvalue)], ["\u2016\u03b2\u2016", fmtNum(s.beta_norm)],
    ["\u0394y / +0.10 cos", fmtNum(s.delta)], ["Docs", fmtInt(s.n_kept)], ["IQR Effect", fmtNum(s.iqr_effect)],
    ["Corr(y, \u0177)", fmtNum(s.y_corr_pred)]];
  if (k === "pca_ols") {
    const u = unit.tables.stats ? one(unit.tables.stats) : s;  // a regression unit: its own term's stats
    const tests = objs(data.tables.test) || [];
    const pOf = label => { const t = label == null ? null : tests.find(r => r.label === label); return t ? fmtP(t.pvalue) : DASH; };
    const terms = data.tables.pls_info ? 1 : data.units.length;  // gradient units are not terms
    return [
      ["R\u00B2", fmtNum(u.r2)], ["Adj. R\u00B2", fmtNum(u.r2_adj)],
      [terms > 1 ? "p (all text terms)" : "p", fmtP(u.pvalue)],
      ...(terms > 1 ? [["p (term)", pOf(unit.test)]] : []),
      ...(data.texts.length > 1 ? [["p (text)", pOf(data.texts[unit.text].name)]] : []),
      ["\u2016\u03b2\u2016", fmtNum(u.beta_norm)], ["Docs", fmtInt(u.n_kept)],
      ["Selected K", fmtInt(data.texts[unit.text].k)], ["Corr(y, \u0177)", fmtNum(u.y_corr_pred)]];
  }
  if (k === "contrast") return [["cos(g1, g2)", fmtNum(s.cos_g1_g2)], ["\u2016unit(g1) \u2212 unit(g2)\u2016", fmtNum(s.diff_norm)]];
  if (k === "groups") {
    const pair = (objs(data.tables.pairs) || []).find(p => p.contrast === unit.key) || {};
    const nA = `n(${unit.pos_label})`, nB = `n(${unit.neg_label})`;
    const tail = [["Cohen's d", fmtNum(pair.cohens_d, 3)], ["\u2016Contrast\u2016", fmtNum(pair.contrast_norm)],
                  ["Docs", fmtInt(s.n_kept)], [nA, fmtInt(pair.n_g1)], [nB, fmtInt(pair.n_g2)]];
    if (data.units.length === 1) return [["p", fmtP(pair.p_raw)], ...tail.slice(0, 2), ["Permutations", fmtInt(s.n_perm)], ...tail.slice(2)];
    return [["Omnibus p", fmtP(s.pvalue)], ["p (corrected)", fmtP(pair.p_corrected)], ...tail];
  }
  const u = one(unit.tables.stats);  // multipls: the last two follow the selected dimension
  return [["Cov. explained", fmtNum(s.cov_explained)], ["p", fmtP(s.pvalue)], ["Docs", fmtInt(s.n)],
          ["Outcomes", fmtInt(s.q)], ["Dimensions", fmtInt(s.ssd_gradients)], ["Cov. share", fmtNum(u.cov_share)],
          ["Score corr.", fmtNum(u.score_corr)]];
}

// ---------------------------------------------------------------- whole-report export
function reportParts(store) {
  const { data, specs, tabs, unit } = store;
  return {
    title: data.title || "SSD results",
    meta: [["Analysis", KIND_LABEL[data.kind] + (unit.label ? ` (${unit.label})` : "")], ["Embedding", embLine(data.texts)],
           ["Software", `${data.software.package} ${data.software.version}`], ["Created", data.created]],
    cards: cardsFor(data, unit),
    sections: tabs.map(([key, label]) => ({ label, tables: Object.values(specs).filter(s => s.tab === key) })).filter(s => s.tables.length),
  };
}
function reportFile(store, ext) {
  if (ext === "html") return { name: "ssd_report.html", mime: "text/html", text: PAGE };
  if (ext === "json") return { name: "ssd_report.json", mime: "application/json", text: JSON.stringify(store.data, null, 2) + "\n" };
  const p = reportParts(store), view = id => store.views[id] || DEFAULT_VIEW;
  const cardCols = p.cards.map(([n], i) => C(String(i), n, "text"));
  const cardRow = Object.fromEntries(p.cards.map(([, v], i) => [String(i), v]));
  if (ext === "docx") {
    const body = [wPara(p.title, "Heading1"), ...p.meta.map(([k, v]) => wPara(`${k}: ${v}`)), toDOCXTable(cardCols, [cardRow])];
    for (const s of p.sections) {
      body.push(wPara(s.label, "Heading2"));
      for (const t of s.tables) body.push(toDOCXTable(t.cols, shownRows(t, view(t.id)), t.title));
    }
    return { name: "ssd_report.docx", mime: WML + ".document", bytes: toDOCX(body.join("")) };
  }
  const fn = { md: toMD, txt: toTXT, tex: toTEX }[ext];
  const out = [];
  if (ext === "md") {
    out.push(`# ${p.title}\n`, p.meta.map(([k, v]) => `**${k}:** ${v}`).join("  \n") + "\n", fn(cardCols, [cardRow]));
    for (const s of p.sections) { out.push(`## ${s.label}\n`); for (const t of s.tables) out.push(`### ${t.title}\n`, fn(t.cols, shownRows(t, view(t.id)))); }
  } else if (ext === "txt") {
    out.push(p.title, "=".repeat(p.title.length), ...p.meta.map(([k, v]) => `${k}: ${v}`), "", fn(cardCols, [cardRow]));
    for (const s of p.sections) { out.push(s.label, "-".repeat(s.label.length), ""); for (const t of s.tables) out.push(t.title, fn(t.cols, shownRows(t, view(t.id)))); }
  } else {
    out.push(`\\section*{${tex(p.title)}}`, p.meta.map(([k, v]) => `\\textbf{${tex(k)}:} ${tex(String(v))}`).join(" \\\\\n") + "\n", fn(cardCols, [cardRow]));
    for (const s of p.sections) { out.push(`\\subsection*{${tex(s.label)}}`); for (const t of s.tables) out.push(`\\subsubsection*{${tex(t.title)}}`, fn(t.cols, shownRows(t, view(t.id)))); }
  }
  return { name: "ssd_report." + ext, mime: "text/plain", text: out.join("\n") };
}

// ---------------------------------------------------------------- tabs
function SnippetDetail({ s }) {
  if (!s) return html`<div class="box"><h3>Snippet</h3><div class="empty">Select a snippet to see its context.</div></div>`;
  return html`<div class="box">
    <h3>Snippet</h3>
    <dl class="kv"><dt>Document</dt><dd>${s.doc_id}</dd><dt>Seed</dt><dd>${FMT.seed(s.seed)}</dd><dt>Cosine</dt><dd>${fmtNum(s.cosine)}</dd></dl>
    <div class="kv-group"><h4>Window</h4><p class="quote">${s.text_window}</p></div>
    <div class="kv-group"><h4>Sentences</h4><p class="quote">${s.text_surface}</p></div>
  </div>`;
}

function OverviewTab({ unit, specs, ui, setUi, text }) {
  const [showAll, setShowAll] = useState(false);
  const [snip, setSnip] = useState(null);
  const cw = objs(unit.tables.cluster_words) || [];
  const sel = ui.cluster;
  const members = sel ? cw.filter(w => w.side === sel.side && w.cluster_id === sel.id).map(w => w.word) : [];
  const pick = side => r => { setUi({ cluster: { side, id: r.cluster_id } }); setSnip(null); setShowAll(false); };
  const clamp = (v, lo, hi, d) => { const n = parseInt(v, 10); return isNaN(n) ? d : Math.min(hi, Math.max(lo, n)); };
  return html`<div class="grid2">
    <div class="stack">
      <div class="controls">
        <label for="topw">Top words per cluster <input id="topw" type="number" min="3" max="30" value=${ui.topWords}
          onChange=${e => setUi({ topWords: clamp(e.target.value, 3, 30, 5) })} /></label>
        <label for="nsn">Snippets per cluster <input id="nsn" type="number" min="5" max="50" value=${ui.nSnips}
          onChange=${e => setUi({ nSnips: clamp(e.target.value, 5, 50, 20) })} /></label>
      </div>
      ${["pos", "neg"].map(side => specs["clusters_" + side] ? html`<div class="box">
        <${DataTable} spec=${specs["clusters_" + side]} short selectable rowKey=${r => side + ":" + r.cluster_id}
          selectedKey=${sel ? sel.side + ":" + sel.id : null} onSelect=${pick(side)} /></div>` : null)}
    </div>
    <div class="stack">
      ${!sel ? html`<div class="box"><div class="empty">Select a cluster to see its words and snippets.</div></div>` : html`
        <div class="box">
          <h3>${(sel.side === "pos" ? unit.pos_label : unit.neg_label)} cluster #${sel.id + 1} <span class="sub">\u00B7 ${members.length} words</span></h3>
          <div class="words">
            ${(showAll ? members : members.slice(0, 8)).map(w => html`<span class="chip">${w}</span>`)}
            ${members.length > 8 ? html`<button class="link" onClick=${() => setShowAll(!showAll)}>${showAll ? "show less" : `+${members.length - 8} more`}</button>` : null}
          </div>
        </div>
        ${specs.cluster_snippets ? html`<div class="box"><${DataTable} spec=${specs.cluster_snippets} short selectable
          rowKey=${r => r.snippet_id + ":" + r.doc_id} selectedKey=${snip ? snip.snippet_id + ":" + snip.doc_id : null} onSelect=${setSnip} /></div>
          <${SnippetDetail} s=${snip} />` : text.snippets === false ? html`<div class="box"><div class="empty">${NO_SNIPPETS}</div></div>` : null}
      `}
    </div>
  </div>`;
}

function SnippetsTab({ unit, specs, ui, setUi, text }) {
  const [snip, setSnip] = useState(null);
  const spec = specs["snippets_" + ui.snipSide];
  if (text.snippets === false) return html`<div class="box"><div class="empty">${NO_SNIPPETS}</div></div>`;
  return html`<div class="stack">
    <div class="controls"><span class="muted">Side</span>
      <div class="seg" role="group" aria-label="Side">
        ${["pos", "neg"].map(s => html`<button aria-pressed=${ui.snipSide === s} onClick=${() => { setUi({ snipSide: s }); setSnip(null); }}>
          ${s === "pos" ? unit.pos_label : unit.neg_label}</button>`)}
      </div>
    </div>
    <div class="grid2">
      <div class="box"><${DataTable} spec=${spec} selectable rowKey=${r => r.snippet_id} selectedKey=${snip && snip.snippet_id} onSelect=${setSnip} /></div>

function PolesTab({ specs }) {

    ${["pos", "neg"].map(s => specs["words_" + s] ? html`<div class="box"><${DataTable} spec=${specs["words_" + s]} /></div>` : null)}

function ScoresTab({ specs }) {
  const [doc, setDoc] = useState(null);
  return html`<div class="grid2">
    <div class="box"><${DataTable} spec=${specs.docs} selectable rowKey=${r => r.doc_id} selectedKey=${doc && doc.doc_id} onSelect=${setDoc} /></div>
    <div class="box">
      <h3>${doc ? `Document ${doc.doc_id}` : "Document"}</h3>
      ${!doc ? html`<div class="empty">Select a row to see the document.</div>` : html`
        <dl class="kv">
          <dt>Cosine</dt><dd>${fmtNum(doc.alignment_score)}</dd>
          ${"y_true" in doc ? html`<dt>Actual Y</dt><dd>${fmtNum(doc.y_true)}</dd><dt>Predicted Y</dt><dd>${fmtNum(doc.y_hat)}</dd><dt>Residual</dt><dd>${fmtNum(doc.residual)}</dd>` : null}
          ${"group" in doc ? html`<dt>Group</dt><dd>${doc.group}</dd>` : null}
        </dl>
        <div class="kv-group"><h4>Text</h4>${doc.text != null ? html`<p class="quote">${doc.text}</p>`
          : html`<p class="muted">This file does not hold this document's text. Text is stored for the documents with the highest and lowest scores${specs.mis_over ? " and the largest prediction errors" : ""}.</p>`}</div>`}
    </div>
  </div>`;
}

// Rolling median, centred, window 7; the window shrinks at the ends.
function rollingMedian(v, w = 7) {
  const h = Math.floor(w / 2);
  return v.map((_, i) => {
    const s = v.slice(Math.max(0, i - h), i + h + 1).filter(isNum).sort((a, b) => a - b);
    return s.length ? (s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2) : null;
  });
}

function SweepTab({ text, specs }) {
  const rows = objs(text.sweep), K = text.k;
  const xs = rows.map(r => r.k), zl = rows.map(r => r.interp_resid_z), zr = rollingMedian(rows.map(r => r.beta_delta_1_minus_cos));
  const W = 800, H = 340, m = { l: 56, r: 64, t: 16, b: 40 };
  const ext = (v, extra = []) => { const f = v.concat(extra).filter(isNum); if (!f.length) return [0, 1]; const lo = Math.min(...f), hi = Math.max(...f); return lo === hi ? [lo - 1, hi + 1] : [lo, hi]; };
  const [x0, x1] = ext(xs), [l0, l1] = ext(zl, [0]), [r0, r1] = ext(zr);
  const X = x => m.l + (x - x0) / (x1 - x0) * (W - m.l - m.r);
  const YL = y => H - m.b - (y - l0) / (l1 - l0) * (H - m.t - m.b);
  const YR = y => H - m.b - (y - r0) / (r1 - r0) * (H - m.t - m.b);
  const path = (ys, Y) => ys.map((y, i) => isNum(y) ? `${X(xs[i])},${Y(y)}` : null).filter(Boolean).join(" ");
  const ticks = (a, b, n = 5) => Array.from({ length: n + 1 }, (_, i) => a + (b - a) * i / n);
  return html`<div class="stack">
    <div class="box"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="PCA sweep">
      ${ticks(l0, l1).map(t => html`<line x1=${m.l} x2=${W - m.r} y1=${YL(t)} y2=${YL(t)} stroke="var(--border-2)" />
        <text x=${m.l - 6} y=${YL(t) + 4} text-anchor="end" font-size="11" fill="var(--fg-2)">${fmtNum(t, 2)}</text>`)}
      ${ticks(r0, r1).map(t => html`<text x=${W - m.r + 6} y=${YR(t) + 4} font-size="11" fill="var(--fg-2)">${fmtNum(t, 3)}</text>`)}
      ${ticks(x0, x1).map(t => html`<text x=${X(t)} y=${H - m.b + 16} text-anchor="middle" font-size="11" fill="var(--fg-2)">${Math.round(t)}</text>`)}
      <text x=${(m.l + W - m.r) / 2} y=${H - 6} text-anchor="middle" font-size="12" fill="var(--fg)">K</text>
      <line x1=${m.l} x2=${W - m.r} y1=${YL(0)} y2=${YL(0)} stroke="var(--fg-3)" stroke-dasharray="4 4" />
      ${isNum(K) ? html`<line x1=${X(K)} x2=${X(K)} y1=${m.t} y2=${H - m.b} stroke="rgb(220,40,40)" stroke-dasharray="6 4" />` : null}
      <polyline points=${path(zr, YR)} fill="none" stroke="rgb(255,127,14)" stroke-width="3" />
      <polyline points=${path(zl, YL)} fill="none" stroke="rgb(31,119,180)" stroke-width="1.5" />
      ${zl.map((y, i) => isNum(y) ? html`<circle cx=${X(xs[i])} cy=${YL(y)} r="2.5" fill="rgb(31,119,180)" />` : null)}
    </svg>
    <div class="words">
      <span class="chip" style="border-color:rgb(31,119,180)">Detrended interpretability (z), left axis</span>
      <span class="chip" style="border-color:rgb(255,127,14)">Beta change (rolling median, 7), right axis</span>
      ${isNum(K) ? html`<span class="chip" style="border-color:rgb(220,40,40)">Selected K = ${K}</span>` : null}
    </div></div>
    <div class="box"><${DataTable} spec=${specs.sweep} /></div>
  </div>`;
}

function PairTablesTab({ specs, tab }) {
  return html`<div class="stack">
    ${Object.values(specs).filter(s => s.tab === tab).map(s => html`<div class="box"><${DataTable} spec=${s} /></div>`)}
  </div>`;
}

const STAT_LABELS = {
  cos_g1_g2: "cos(g1, g2)", diff_norm: "\u2016unit(g1) \u2212 unit(g2)\u2016",
  backend: "Backend", r2: "R\u00B2", r2_adj: "Adj. R\u00B2", pvalue: "p", n_raw: "Documents (raw)", n_kept: "Documents kept",
  n_dropped: "Documents dropped", y_mean: "Mean y", y_std: "SD y", beta_norm: "\u2016\u03b2\u2016", delta: "\u0394y / +0.10 cos",
  iqr_effect: "IQR effect", y_corr_pred: "Corr(y, \u0177)", n_components: "Components", p_at_k: "p at K",
  n_splits: "Splits", random_state: "Random state", name: "Test", split_r2: "Split R\u00B2",
  k: "k", k_max: "k max", k_min: "k min", topn: "Words clustered", min_cluster_size: "Min. cluster size",
  G: "Groups", n_perm: "Permutations", correction: "Correction", omnibus_T: "Omnibus T", omnibus_p: "Omnibus p",
  n: "Documents", q: "Outcomes", rotate: "Rotation", cov_explained: "Cov. explained", statistic: "Statistic",
  df: "df", df_resid: "Residual df", r2_delta: "\u0394R\u00B2", ssd_gradients: "Gradients",
};
const fmtAny = (k, v) => v == null ? DASH : typeof v === "boolean" ? (v ? "yes" : "no") : ["pvalue", "p_at_k", "omnibus_p"].includes(k) ? fmtP(v)
  : Number.isInteger(v) ? fmtInt(v) : isNum(v) ? fmtNum(v) : Array.isArray(v) ? v.join(", ") : String(v);
function KV({ title, obj, skipNull }) {
  const entries = Object.entries(obj || {}).filter(([, v]) => !(skipNull && v == null));
  if (!entries.length) return null;
  return html`<div class="kv-group">${title ? html`<h4>${title}</h4>` : null}
    <dl class="kv">${entries.map(([k, v]) => html`<dt>${STAT_LABELS[k] || k}</dt><dd>${fmtAny(k, v)}</dd>`)}</dl></div>`;
}

function DetailsTab({ data, unit, specs, text }) {
  // A regression term has its own stats; a gradient's stats hold only cov_share and score_corr.
  const st = one(data.kind === "pca_ols" && unit.tables.stats && !isGradient(data, unit) ? unit.tables.stats : data.tables.stats), S = text.settings || {}, E = text.embeddings || {};
  const boxTitle = t => text.name && data.texts.length > 1 ? `${t} \u2014 ${text.name}` : t;
  const pick = keys => Object.fromEntries(keys.filter(k => k in st).map(k => [k, st[k]]));
  const continuous = data.kind === "pls" || data.kind === "pca_ols";
  return html`<div class="grid3">
    <div class="box"><h3>Result information</h3>
      ${continuous ? html`
        <${KV} title="Model fit" obj=${pick(["backend", "r2", "r2_adj", "pvalue", "y_corr_pred"])} />
        <${KV} title="Effect size" obj=${pick(["beta_norm", "delta", "iqr_effect", "y_mean", "y_std"])} />
        <${KV} title="Data retention" obj=${pick(["n_raw", "n_kept", "n_dropped"])} />`
      : html`<${KV} title="Summary" obj=${st} />`}
      <${KV} title="Fit" obj=${one(unit.tables.fit_info || data.tables.fit_info || data.tables.pls_info)} skipNull />
      ${data.tables.fit_info && data.tables.pls_info ? html`<${KV} title="Gradients" obj=${one(data.tables.pls_info)} skipNull />` : null}
      <${KV} title="Test" obj=${one(data.tables.test)} skipNull />
      ${specs.pairs ? html`<${DataTable} spec=${specs.pairs} />` : null}
      ${specs.tests ? html`<${DataTable} spec=${specs.tests} />` : null}
      ${specs.outcomes ? html`<${DataTable} spec=${specs.outcomes} />` : null}
    </div>
    ${text.settings ? html`<div class="box"><h3>${boxTitle("Concept")}</h3>
      <${KV} obj=${{ Mode: S.use_full_doc ? "Full document" : "Lexicon", ...(S.lexicon ? { Lexicon: S.lexicon } : {}), Window: S.window, SIF: S.sif_a }} />
    </div>` : null}
    <div class="box"><h3>Model</h3>
      <${KV} title=${boxTitle("Embedding")} obj=${{ Name: E.name, Version: E.version, Language: E.language, Vocabulary: E.n, Dimensions: E.dims, ABTT: E.abtt }} />
      <${KV} title="Fit arguments" obj=${data.settings.fit} />
      <${KV} title="Clustering arguments" obj=${data.settings.clusters} />
      ${data.dataset ? html`<${KV} title="Dataset" obj=${data.dataset} />` : null}
    </div>
  </div>`;
}

// ---------------------------------------------------------------- app
function App({ data }) {
  const [unitIdx, setUnitIdx] = useState(0);
  const [chosenTab, setTab] = useState("overview");
  const [views, setViews] = useState({});
  const [ui, setUiState] = useState({ topWords: 5, nSnips: 20, cluster: null, snipSide: "pos" });
  const unit = data.units[unitIdx];
  const specs = useMemo(() => buildSpecs(data, unit, ui), [unit, ui]);
  const tabs = tabsFor(data, specs, data.texts[unit.text]);
  // Units can have different tabs (a PLS gradient has no Misdiagnosed tab): fall back to the first one.
  const tab = tabs.some(([k]) => k === chosenTab) ? chosenTab : tabs[0][0];
  const setUi = patch => setUiState(u => ({ ...u, ...patch }));
  const store = {
    data, specs, tabs, views, unit,
    setView: (id, v) => setViews(vs => ({ ...vs, [id]: v })),
  };
  window.ssdReport = { formats: REPORT_EXTS, export: ext => download(reportFile(store, ext)) };
  const body = {
    overview: html`<${OverviewTab} unit=${unit} text=${data.texts[unit.text]} specs=${specs} ui=${ui} setUi=${setUi} />`,
    details: html`<${DetailsTab} data=${data} unit=${unit} text=${data.texts[unit.text]} specs=${specs} />`,
    covariates: html`<${PairTablesTab} specs=${specs} tab="covariates" />`,
    sweep: html`<${SweepTab} text=${data.texts[unit.text]} specs=${specs} />`,
    snippets: html`<${SnippetsTab} unit=${unit} text=${data.texts[unit.text]} specs=${specs} ui=${ui} setUi=${setUi} />`,
    poles: html`<${PolesTab} specs=${specs} />`,
    scores: html`<${ScoresTab} specs=${specs} />`,
    extreme: html`<${PairTablesTab} specs=${specs} tab="extreme" />`,
    mis: html`<${PairTablesTab} specs=${specs} tab="mis" />`,
  }[tab];
  return html`<${Store.Provider} value=${store}>
    <header class="hdr">
      <h1>${data.title || "SSD results"}</h1>
      <span class=${"badge " + data.kind}>${KIND_LABEL[data.kind]}</span>
      <span class="spacer"></span>
      ${EMBEDDED ? null : html`<${ExportMenu} report />`}
    </header>
    <div class="meta">
      <span>Embedding <b>${embLine(data.texts)}</b></span>
      <span>${data.software.package} <b>${data.software.version}</b></span>
      <span>${new Date(data.created).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" })}</span>
    </div>
    ${data.units.length > 1 ? html`<div class="unitbar"><label for="unit">${data.kind === "groups" ? "Pair" : data.kind === "pca_ols" && !data.tables.pls_info ? "Term" : "Dimension"}</label>
      <select id="unit" value=${unitIdx} onChange=${e => { setUnitIdx(+e.target.value); setUi({ cluster: null, snipSide: "pos" }); }}>
        ${data.texts.length > 1 ? data.texts.map((t, ti) => html`<optgroup label=${t.name || "Text " + (ti + 1)}>${data.units.map((u, i) => u.text === ti ? html`<option value=${i}>${u.label}</option>` : null)}</optgroup>`)
          : data.units.map((u, i) => html`<option value=${i}>${u.label}</option>`)}</select></div>` : null}
    <section class="cards" aria-label="Summary">${cardsFor(data, unit).map(([n, v]) => html`<div class="card"><div class="v">${v}</div><div class="n">${n}</div></div>`)}</section>
    <nav class="tabs" role="tablist">${tabs.map(([k, label]) => html`<button class="tab" role="tab" aria-selected=${tab === k} onClick=${() => setTab(k)}>${label}</button>`)}</nav>
    <section class="tabpanel" role="tabpanel">${body}</section>
  <//>`;
}

const root = document.getElementById("app");
const data = JSON.parse(document.getElementById("ssd-data").textContent);
if (data.report_format !== REPORT_FORMAT) {
  root.innerHTML = "";
  const p = document.createElement("p");
  p.className = "err";
  p.textContent = `This file has report format ${data.report_format}; this page reads format ${REPORT_FORMAT}.`;
  root.appendChild(p);
} else {
  render(html`<${App} data=${data} />`, root);
}
</script>
</body>
</html>
